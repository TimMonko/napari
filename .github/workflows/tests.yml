# Test workflow (pixi-based).
#
# Replaces the tox-based "PR Test" and "Comprehensive Test" workflows, selecting
# the test *scope* by trigger:
#   * pull_request           -> test-pr             (fast, representative subset)
#   * push to main / v* tags -> test-comprehensive  (broad matrix)
#   * workflow_dispatch      -> whichever the `mode` input selects
#
# Each cell runs the composite action in .github/actions/pixi-test, so the
# matrices below stay plain literal YAML. Tests run inside the pixi environments
# defined in pyproject.toml ([tool.pixi]) and locked in pixi.lock; packaging is
# validated by building the wheel and testing it. Coverage is uploaded to Codecov.
name: Tests

on:
  pull_request:
    branches:
      - main
      - "v*x"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Test scope to run"
        type: choice
        default: comprehensive
        options:
          - pr
          - comprehensive

concurrency:
  # Cancel superseded runs on PRs; let push/tag runs finish.
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Fast canary: a couple of no-coverage cells + headless. The full matrices
  # below gate on this, so obvious breakage fails in minutes before the broad
  # (and slow, cross-OS) matrix is provisioned.
  # ---------------------------------------------------------------------------
  test-initial:
    name: initial · ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        environment:
          - test-py311-pyqt6
          - test-py314-pyqt6
          - test-py312-headless
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags
          persist-credentials: false
      - uses: ./.github/actions/pixi-test
        with:
          environment: ${{ matrix.environment }}
          task: test  # canary: no coverage, for speed

  # ---------------------------------------------------------------------------
  # Build + inspect the sdist/wheel directly (packaging/manifest validation).
  # ---------------------------------------------------------------------------
  build-package:
    name: Build & inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@d44ca7d91762de7a7d5436ddae667c6da6d1c3df # v2.18.0

  # ---------------------------------------------------------------------------
  # Test the BUILT WHEEL (not the editable tree). Installs the artifact from
  # build-package and runs the suite via `--pyargs`, so we exercise the packaged
  # code + data files + entry points a real `pip install` gets. This is the
  # packaging-fidelity net that the editable matrix intentionally trades away
  # for speed (src-layout editable installs mask missing package data).
  # ---------------------------------------------------------------------------
  test-wheel:
    needs: build-package
    name: Test built wheel (--pyargs)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Checked out only for the pytest config; the code under test comes from
      # the installed wheel (src/ is deliberately NOT on sys.path here).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: napari-src
          persist-credentials: false

      - name: Download built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
        with:
          qt: true
          wm: herbstluftwm

      - name: Install napari from the built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}[pyqt6]"
          python -m pip install --group napari-src/pyproject.toml:testing

      - name: Test the installed package
        run: |
          python -m pytest --pyargs napari napari_builtins \
            --color=yes --basetemp=.pytest_tmp \
            --config-file=napari-src/pyproject.toml

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-wheel
          path: .pytest_tmp
          include-hidden-files: true

  # ---------------------------------------------------------------------------
  # PR scope: fast, representative subset (Linux only). Runs on pull_request,
  # or on a manual dispatch that selects `pr`.
  # ---------------------------------------------------------------------------
  test-pr:
    needs: test-initial
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'pr')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Former PR Test matrix. The canary combos (py311-pyqt6,
        # py314-pyqt6, py312-headless on ubuntu-latest) run in test-initial and
        # are intentionally omitted here to avoid double-running them.
        include:
          # base backends (py314-pyqt6 on ubuntu runs in test-initial)
          - { environment: test-py314-pyside6, runner: ubuntu-latest }
          # cross-OS
          - { environment: test-py311-pyqt6, runner: windows-latest }
          - { environment: test-py314-pyqt6, runner: windows-latest }
          - { environment: test-py314-pyqt6-nonumba, runner: macos-15-intel }
          - { environment: test-py314-pyqt6, runner: macos-15 }
          - { environment: test-py314-pyqt6, runner: ubuntu-24.04-arm }
          # variants
          - { environment: test-py314-pyqt6-nonumba, runner: ubuntu-latest }
          - { environment: test-py311-pyqt6-torch, runner: ubuntu-latest }
          - { environment: test-py313-pyqt6-alloptional, runner: ubuntu-22.04 }
          - { environment: test-py312-examples, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags
          persist-credentials: false
      - uses: ./.github/actions/pixi-test
        with:
          environment: ${{ matrix.environment }}
      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.environment }}-${{ matrix.runner }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Comprehensive scope: pyqt6 across all supported Pythons on Linux+Windows,
  # plus macOS/arm and the optional-dependency variants. Runs on push to main /
  # v* tags, or a manual dispatch that selects `comprehensive`.
  # ---------------------------------------------------------------------------
  test-comprehensive:
    needs: test-initial
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'comprehensive')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Former Comprehensive Test matrix.
        include:
          # pyqt6 across all supported Pythons, on Linux and Windows
          - { environment: test-py312-pyqt6, runner: ubuntu-latest }
          - { environment: test-py313-pyqt6, runner: ubuntu-latest }
          - { environment: test-py314-pyqt6, runner: ubuntu-latest }
          - { environment: test-py311-pyqt6, runner: windows-latest }
          - { environment: test-py312-pyqt6, runner: windows-latest }
          - { environment: test-py313-pyqt6, runner: windows-latest }
          - { environment: test-py314-pyqt6, runner: windows-latest }
          # macOS + linux-arm
          - { environment: test-py311-pyqt6, runner: macos-15 }
          - { environment: test-py314-pyqt6, runner: ubuntu-24.04-arm }
          # variants
          - { environment: test-py311-headless, runner: ubuntu-22.04 }
          - { environment: test-py314-pyqt6-torch, runner: ubuntu-latest }
          - { environment: test-py312-pyside6-torch, runner: ubuntu-latest }
          # minimum requirements (replaces tox-min-req, MIN_REQ=1)
          - { environment: min-req-py311-pyqt6, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # setuptools_scm needs full history/tags
          persist-credentials: false
      - uses: ./.github/actions/pixi-test
        with:
          environment: ${{ matrix.environment }}
      - name: Upload coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.environment }}-${{ matrix.runner }}
          path: .coverage*
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # conda-forge: napari built as a conda package (pixi-build) and tested against
  # conda-forge builds of its dependencies. Separate workspace, see
  # tools/conda-forge/pixi.toml.
  # ---------------------------------------------------------------------------
  test-conda-forge:
    name: conda-forge
    needs: test-initial
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python: ["313"]
        backend: [pyqt6, pyside6]
    uses: ./.github/workflows/reusable_conda_forge_test.yml
    with:
      python_version: ${{ matrix.python }}
      platform: ${{ matrix.platform }}
      qt_backend: ${{ matrix.backend }}

  # ---------------------------------------------------------------------------
  # Combine coverage across whichever scope ran and upload it to Codecov
  # (the shared workflow combines the .coverage* files of each artifact).
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage report
    needs: [test-pr, test-comprehensive]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    secrets: inherit
    uses: napari/shared-workflows/.github/workflows/upload_coverage.yml@main
    with:
      artifact-pattern: 'coverage-*'
