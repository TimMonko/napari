name: pixi test
description: >-
  Run the napari test suite in a single pixi environment. Shared by the test
  jobs in test.yml as a composite action.

inputs:
  environment:
    description: "pixi environment to run (must exist in pixi.toml)"
    required: true
  task:
    description: "pixi task to run (use 'test' for a fast no-coverage run)"
    required: false
    default: test-cov

runs:
  using: composite
  steps:
    - name: Setup headless display
      # Runs on all OSes: Xvfb on Linux, and (crucially) software OpenGL (Mesa)
      # on Windows — without it, GL calls like glGetParameter(GL_MAX_TEXTURE_SIZE)
      # fail with GLError 1282 on the GPU-less Windows runners.
      uses: pyvista/setup-headless-display-action@5bc8de3bc71fcda7a96439571287a554901541a0 # v4.3
      with:
        qt: true
        wm: herbstluftwm

    - name: Set Windows resolution
      if: runner.os == 'Windows'
      shell: powershell
      run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

    - name: Disable ptrace security restrictions
      if: runner.os == 'Linux'
      shell: bash
      run: echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      with:
        environments: ${{ inputs.environment }}
        # Use the committed pixi.lock verbatim; never re-solve in CI.
        frozen: true
        cache: true

    - name: Run tests
      shell: bash
      # Pass the inputs via env (data), not expanded into the script, so an
      # untrusted value can't be interpreted as shell code (zizmor template-injection).
      env:
        PIXI_ENVIRONMENT: ${{ inputs.environment }}
        PIXI_TASK: ${{ inputs.task }}
      run: pixi run --frozen -e "$PIXI_ENVIRONMENT" "$PIXI_TASK"
